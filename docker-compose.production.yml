services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_DEBUG: "false"
      MODEL_PATH: /app/backend/placement_model.joblib
      CORS_ORIGINS: http://localhost:8080
      HISTORY_DATABASE_PATH: /app/backend/data/assessment_history.sqlite3
      AUTH_DATABASE_PATH: /app/backend/data/auth.sqlite3
      SESSION_TTL_SECONDS: "28800"
      # This stack is served over plain HTTP on localhost for smoke testing.
      # Set to "true" whenever the frontend is behind TLS termination.
      AUTH_COOKIE_SECURE: "false"
      COHORT_MIN_GROUP_SIZE: "5"
    expose:
      - "5000"
    volumes:
      - backend-data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/readiness')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  backend-data:
